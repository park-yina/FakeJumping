<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짝퉁배틀 관리자 대시보드</title>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #181c27;
            --surface2: #1e2436;
            --border: #2a3050;
            --accent: #4f80ff;
            --accent-dim: rgba(79,128,255,0.12);
            --accent-glow: rgba(79,128,255,0.3);
            --text: #e8eaf0;
            --text-dim: #8892a4;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --sidebar-w: 240px;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100%;
        }

        .sidebar-brand {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo { color: var(--accent); font-size: 12px; }
        .title { font-weight: 700; }

        .nav-item {
            display: block;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 4px;
            cursor: pointer;
            color: var(--text-dim);
        }

        .nav-item:hover { background: var(--accent-dim); }
        .nav-item.active { color: var(--accent); }

        .main {
            margin-left: var(--sidebar-w);
            width: 100%;
        }

        .topbar {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .content-area {
            padding: 24px;
        }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: white;
        }
    </style>


</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo" id="logo-text">ADMIN</div>
        <div class="title">짝퉁배틀</div>
    </div>

    <div id="super-admin-menu" style="display:none">
        <div class="nav-item active" onclick="navigate('home', this)">🏠 대시보드</div>
        <div class="nav-item" onclick="navigate('create-store', this)">🏪 매장 생성</div>
        <div class="nav-item" onclick="navigate('store-list', this)">📋 매장 목록</div>
        <div class="nav-item" onclick="navigate('temp', this)">👤 임시 계정</div>
    </div>

    <div id="store-admin-menu" style="display:none">
        <div class="nav-item active" onclick="navigate('home', this)">🏠 홈</div>
        <div class="nav-item" onclick="navigate('my-store', this)">내 매장</div>
    </div>

    <div style="padding:16px;">
        <button class="btn btn-ghost" onclick="logout()">로그아웃</button>
    </div>

</aside>

<!-- MAIN -->

<div class="main">

    <div class="topbar">
        <span id="page-title">대시보드</span>
    </div>

    <div class="content-area" id="main-content"></div>

</div>

<script>

    function setActive(el) {
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
    }
    function navigate(page, el) {
        setActive(el);

        if (page === 'home') renderHome();
        if (page === 'create-store') renderCreateStore();
        if (page === 'store-list') renderTemp();
        if (page === 'temp') renderTemp();
    }

    async function checkLogin() {
        const token = localStorage.getItem("accessToken");
        if (!token) {
            location.href = "/sign-inView";
            return;
        }

        const res = await fetch("/auth/me", {
            headers: { Authorization: "Bearer " + token }
        });

        if (!res.ok) {
            localStorage.clear();
            location.href = "/sign-inView";
            return;
        }

        const data = await res.json();
        localStorage.setItem("role", data.role);
        applyRole(data.role);
    }

    function applyRole() {
        const role = localStorage.getItem("role");
        const logo = document.getElementById("logo-text");
        console.log("role:", role); // 🔥 찍어봐
        if (role === "SUPER_ADMIN") {
            document.getElementById("super-admin-menu").style.display = "block";
            logo.textContent = "SUPER ADMIN";
            logo.classList.add("text-red-500");
        } else {
            document.getElementById("store-admin-menu").style.display = "block";
            logo.textContent = "STORE ADMIN";
            logo.classList.add("text-blue-500");
        }
    }

    async function init() {
        await checkLogin();
        applyRole();   // 🔥 이거 추가
        renderHome();
    }

    init();

    function renderHome() {
        document.getElementById("page-title").textContent = "대시보드";
        document.getElementById("main-content").innerHTML = `
            <div class="card">환영합니다 👋</div>
        `;
    }

    function renderCreateStore() {
        document.getElementById("page-title").textContent = "스토어 생성";

        document.getElementById("main-content").innerHTML = `
            <div class="card">
                <input id="storeName" placeholder="스토어 이름">
                <br><br>
                <button class="btn btn-primary" onclick="createStore()">생성</button>
            </div>
        `;
    }

    async function createStore() {
        const name = document.getElementById("storeName").value;

        if (!name) {
            Swal.fire("이름 입력하세요");
            return;
        }

        const res = await fetch("/admin/stores", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + localStorage.getItem("accessToken")
            },
            body: JSON.stringify({ name })
        });

        const data = await res.json();

        Swal.fire("생성 완료", data.storeName);
    }

    async function renderTemp() {
        document.getElementById("page-title").textContent = "임시 계정";

        document.getElementById("main-content").innerHTML = `
        <div class="card flex flex-col items-center justify-center py-16 text-center">
            <div class="text-5xl mb-4">🚧</div>
            <h2 class="text-xl font-semibold mb-2">준비중입니다</h2>
            <p class="text-gray-500">위 기능은 곧 추가될 예정입니다.</p>
        </div>
    `;
    }

    async function logout() {
        const token = localStorage.getItem("accessToken");

        await fetch("/api/auth/sign-out", {
            method: "POST", // 🔥 중요
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        localStorage.clear();
        location.href = "/sign-inView";
    }
</script>

</body>
</html>
