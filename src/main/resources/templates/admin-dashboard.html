<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짝퉁배틀 관리자 대시보드</title>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #181c27;
            --surface2: #1e2436;
            --border: #2a3050;
            --accent: #4f80ff;
            --accent-dim: rgba(79,128,255,0.12);
            --accent-glow: rgba(79,128,255,0.3);
            --text: #e8eaf0;
            --text-dim: #8892a4;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --sidebar-w: 240px;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100%;
        }

        .sidebar-brand {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo { color: var(--accent); font-size: 12px; }
        .title { font-weight: 700; }

        .nav-item {
            display: block;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 4px;
            cursor: pointer;
            color: var(--text-dim);
        }

        .nav-item:hover { background: var(--accent-dim); }
        .nav-item.active { color: var(--accent); }

        .main {
            margin-left: var(--sidebar-w);
            width: 100%;
        }

        .topbar {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .content-area {
            padding: 24px;
        }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: white;
        }
    </style>


</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo" id="logo-text">ADMIN</div>
        <div class="title">짝퉁배틀</div>
    </div>

    <div id="super-admin-menu" style="display:none">
        <div class="nav-item active" onclick="navigate('home', this)">🏠 대시보드</div>
        <div class="nav-item" onclick="navigate('create-store', this)">🏪 매장 생성</div>
        <div class="nav-item" onclick="navigate('store-list', this)">📋 매장 목록</div>
        <div class="nav-item" onclick="navigate('temp', this)">👤 임시 계정</div>
    </div>

    <div id="store-admin-menu" style="display:none">
        <div class="nav-item active" onclick="navigate('home', this)">🏠 홈</div>
        <div class="nav-item" onclick="navigate('my-store', this)">내 매장</div>
    </div>

    <div style="padding:16px;">
        <button class="btn btn-ghost" onclick="logout()">로그아웃</button>
    </div>

</aside>

<!-- MAIN -->

<div class="main">

    <div class="topbar">
        <span id="page-title">대시보드</span>
    </div>

    <div class="content-area" id="main-content"></div>

</div>

<script>

    function setActive(el) {
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
    }
    function navigate(page, el) {
        setActive(el);

        if (page === 'home') renderHome();
        if (page === 'create-store') renderCreateStore();
        if (page === 'store-list') renderTemp();
        if (page === 'temp') renderTemp();
    }

    async function checkLogin() {
        const token = localStorage.getItem("accessToken");
        if (!token) {
            location.href = "/sign-inView";
            return;
        }

        const res = await fetch("/auth/me", {
            headers: { Authorization: "Bearer " + token },
        });

        if (!res.ok) {
            localStorage.clear();
            location.href = "/sign-inView";
            return;
        }

        const data = await res.json();
        localStorage.setItem("role", data.role);
        applyRole(data.role);
    }

    function applyRole() {
        const role = localStorage.getItem("role");
        const logo = document.getElementById("logo-text");
        console.log("role:", role); // 🔥 찍어봐
        if (role === "SUPER_ADMIN") {
            document.getElementById("super-admin-menu").style.display = "block";
            logo.textContent = "SUPER ADMIN";
            logo.classList.add("text-red-500");
        } else {
            document.getElementById("store-admin-menu").style.display = "block";
            logo.textContent = "STORE ADMIN";
            logo.classList.add("text-blue-500");
        }
    }

    async function init() {
        await checkLogin();
        applyRole();   // 🔥 이거 추가
        renderHome();
    }

    init();

    function renderHome() {
        document.getElementById("page-title").textContent = "대시보드";
        document.getElementById("main-content").innerHTML = `
            <div class="card">환영합니다 👋</div>
        `;
    }

    function renderCreateStore() {
        document.getElementById("page-title").textContent = "스토어 생성";

        document.getElementById("main-content").innerHTML = `
        <div class="card p-6 max-w-2xl mx-auto">

            <h2 class="text-xl font-semibold mb-6">새 매장 등록</h2>

            <!-- 스토어 이름 -->
            <div class="mb-4">
                <label class="block text-sm mb-1 text-gray-400">스토어 이름</label>
                <input id="storeName"
                       class="w-full p-3 rounded-lg bg-gray-900 border border-gray-700 focus:outline-none focus:border-blue-500"
                       placeholder="예: 강남점">
            </div>

            <!-- 주소 -->
            <div class="mb-4">
                <label class="block text-sm mb-1 text-gray-400">주소</label>
                <div class="flex gap-2">
                    <input id="address"
                           class="flex-1 p-3 rounded-lg bg-gray-900 border border-gray-700"
                           placeholder="주소 검색 버튼을 눌러주세요"
                           readonly onclick="searchAddress()">
                    <button onclick="searchAddress()"
                            class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg">
                        검색
                    </button>
                </div>
            </div>

            <!-- 지역 -->
            <div class="mb-6">
                <label class="block text-sm mb-1 text-gray-400">지역</label>
                <input id="region"
                       class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 text-gray-400"
                       readonly>
            </div>

            <!-- 버튼 영역 -->
            <div class="flex justify-end gap-2">
                <button onclick="goHome()"
                        class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg">
                    취소
                </button>
                <button class="px-5 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold"
                        onclick="createStore()">
                    생성
                </button>
            </div>

        </div>
    `;
    }
    function searchAddress() {
        new daum.Postcode({
            oncomplete: function(data) {

                // 전체 주소
                document.getElementById("address").value = data.address;

                // region (시/도)
                document.getElementById("region").value = data.sido;
            }
        }).open();
    }
    async function createStore() {
        const storeName = document.getElementById("storeName").value;
        const address = document.getElementById("address").value;
        const region = document.getElementById("region").value;

        if (!storeName) {
            Swal.fire("스토어 명을 입력하세요");
            return;
        }

        if (!address || !region) {
            Swal.fire("주소를 선택하세요");
            return;
        }

        const requestData = {
            storeName,
            address,
            region
        };

        try {
            const res = await fetch("/api/stores", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + localStorage.getItem("accessToken")
                },
                body: JSON.stringify(requestData) // ✅ 여기 중요
            });

            if (!res.ok) {
                throw new Error("서버 오류");
            }

            const data = await res.json();

            Swal.fire({
                title: "생성 완료 🎉",
                html: `
                <b>매장명:</b> ${data.storeName}<br>
                <b>계정:</b> ${data.username}<br>
                <b>임시 비밀번호:</b> ${data.tempPassword}
            `,
                icon: "success"
            });

            console.log(data);

        } catch (e) {
            console.error(e);
            Swal.fire("에러 발생", "스토어 생성 실패", "error");
        }
    }
    async function renderTemp() {
        document.getElementById("page-title").textContent = "임시 계정";

        document.getElementById("main-content").innerHTML = `
        <div class="card flex flex-col items-center justify-center py-16 text-center">
            <div class="text-5xl mb-4">🚧</div>
            <h2 class="text-xl font-semibold mb-2">준비중입니다</h2>
            <p class="text-gray-500">위 기능은 곧 추가될 예정입니다.</p>
        </div>
    `;
    }

    async function logout() {
        const token = localStorage.getItem("accessToken");

        await fetch("/api/auth/sign-out", {
            method: "POST", // 🔥 중요
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        localStorage.clear();
        location.href = "/sign-inView";
    }
</script>

</body>
</html>
