<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>짝퉁배틀 관리자 대쉬보드</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            overflow-x: hidden;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background-color: #212529;
            color: white;
            position: fixed;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }

        .sidebar a:hover {
            background-color: #343a40;
        }

        .content {
            margin-left: 240px;
            padding: 30px;
        }
    </style>
</head>
<body>

<!-- ✅ 사이드바 -->
<div class="sidebar">
    <h4 class="text-center py-3">관리자</h4>

    <div id="super-admin-menu" style="display:none;">
        <a href="#" onclick="showCreateStore()">스토어 생성</a>
        <a href="#" onclick="showTempAccounts()">임시 계정 관리</a>
    </div>

    <div id="store-admin-menu" style="display:none;">
        <a href="#">내 매장 조회</a>
    </div>
</div>

<!-- ✅ 메인 콘텐츠 -->
<div class="content">

    <h2>대시보드</h2>

    <div id="main-content">
        <p>메뉴를 선택하세요</p>
    </div>

</div>

<script>
    async function checkLogin() {
        const token = localStorage.getItem("accessToken");

        if (!token) {
            location.href = "/sign-inView";
            return;
        }

        try {
            const res = await fetch("/auth/me", {
                headers: {
                    Authorization: "Bearer " + token
                }
            });

            if (!res.ok) {
                throw new Error();
            }

            const data = await res.json();

            // role도 여기서 가져오기
            localStorage.setItem("role", data.role);

        } catch (e) {
            localStorage.removeItem("accessToken");
            location.href = "/sign-inView";
        }
    }

    checkLogin();
    const role = localStorage.getItem("role") || "SUPER_ADMIN";

    if (role === "SUPER_ADMIN") {
        document.getElementById("super-admin-menu").style.display = "block";
    } else {
        document.getElementById("store-admin-menu").style.display = "block";
    }

    // ✅ 스토어 생성 화면
    function showCreateStore() {
        document.getElementById("main-content").innerHTML = `
            <h3>스토어 생성</h3>
            <div class="mb-3">
                <input type="text" id="storeName" class="form-control" placeholder="스토어 이름">
            </div>
            <button class="btn btn-primary" onclick="createStore()">생성</button>
        `;
    }

    // ✅ 스토어 생성 API
    function createStore() {
        const name = document.getElementById("storeName").value;

        if (!name) {
            Swal.fire("경고", "스토어 이름을 입력하세요", "warning");
            return;
        }

        fetch('/admin/stores', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + localStorage.getItem("accessToken")
            },
            body: JSON.stringify({ name: name })
        })
            .then(res => {
                if (!res.ok) throw new Error("생성 실패");
                return res.json();
            })
            .then(data => {
                Swal.fire({
                    title: "스토어 생성 완료",
                    html: `
                    <p><b>매장명:</b> ${data.storeName}</p>
                    <p><b>관리자 ID:</b> ${data.username}</p>
                    <p><b>임시 비밀번호:</b> ${data.tempPassword}</p>
                    <button class="btn btn-sm btn-outline-primary mt-2" onclick="copyPassword('${data.tempPassword}')">비밀번호 복사</button>
                `,
                    icon: "success"
                });
            })
            .catch(err => {
                Swal.fire("에러", err.message, "error");
            });
    }

    // ✅ 복사 기능
    function copyPassword(password) {
        navigator.clipboard.writeText(password);
        Swal.fire("복사 완료", "비밀번호가 복사되었습니다", "success");
    }

    // ✅ 임시 계정 목록
    function showTempAccounts() {
        fetch('/admin/temp-accounts')
            .then(res => res.json())
            .then(data => {
                let html = `
                    <h3>임시 계정 관리</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>매장명</th>
                                <th>아이디</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.forEach(item => {
                    html += `
                        <tr>
                            <td>${item.storeName}</td>
                            <td>${item.username}</td>
                            <td>
                                ${item.mustChangePassword ?
                        '<span class="badge bg-warning">비밀번호 변경 필요</span>' :
                        '<span class="badge bg-success">정상</span>'}
                            </td>
                        </tr>
                    `;
                });

                html += "</tbody></table>";

                document.getElementById("main-content").innerHTML = html;
            })
            .catch(() => {
                Swal.fire("에러", "데이터 조회 실패", "error");
            });
    }
</script>

</body>
</html>
