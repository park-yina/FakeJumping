<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짝퉁배틀 관리자 대시보드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/js/admin-dashboard.js"></script>
    <script type="module" src="/js/common-uis.js"></script>
    <script type="module" src="/js/store-uis.js"></script>
    <style>
        /* ── Reset ─────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        a { text-decoration: none; color: inherit; }
        button { font: inherit; cursor: pointer; }

        /* ── Design tokens ──────────────────────────────── */
        :root {
            /* surface */
            --bg:         #0c0e14;
            --surface-1:  #13161f;
            --surface-2:  #191d29;
            --surface-3:  #1f2435;

            /* border */
            --border-1:   rgba(255,255,255,0.06);
            --border-2:   rgba(255,255,255,0.10);

            /* brand */
            --violet:     #7b6ef6;
            --violet-dim: rgba(123,110,246,0.12);
            --violet-glow:rgba(123,110,246,0.20);

            /* semantic */
            --amber:      #f0a535;
            --amber-dim:  rgba(240,165,53,0.10);
            --rose:       #e05c8a;
            --rose-dim:   rgba(224,92,138,0.10);
            --teal:       #38c9a0;
            --teal-dim:   rgba(56,201,160,0.10);

            /* text */
            --txt-1:      #e4e6ed;
            --txt-2:      #7e8799;
            --txt-3:      #4a5163;

            /* layout */
            --sidebar-w:  220px;
            --radius-sm:  6px;
            --radius-md:  10px;
            --radius-lg:  14px;

            /* font */
            --font:       'IBM Plex Sans KR', sans-serif;
            --mono:       'IBM Plex Mono', monospace;
        }

        /* ── Base ───────────────────────────────────────── */
        body {
            font-family: var(--font);
            font-size: 14px;
            background: var(--bg);
            color: var(--txt-1);
            display: flex;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── Sidebar ────────────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            background: var(--surface-1);
            border-right: 1px solid var(--border-1);
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            padding: 20px 18px 16px;
            border-bottom: 1px solid var(--border-1);
        }

        .logo {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--violet);
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--txt-1);
            letter-spacing: -0.02em;
        }

        /* ── Nav ────────────────────────────────────────── */
        .nav-section {
            flex: 1;
            padding: 10px 8px;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            margin-bottom: 1px;
            cursor: pointer;
            color: var(--txt-2);
            font-size: 13.5px;
            transition: color 0.15s, background 0.15s;
            user-select: none;
        }
        .nav-item i {
            width: 16px;
            text-align: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .nav-item:hover {
            color: var(--txt-1);
            background: var(--border-1);
        }
        .nav-item.active {
            color: var(--violet);
            background: var(--violet-dim);
        }

        /* ── Sidebar footer ─────────────────────────────── */
        .sidebar-footer {
            padding: 12px 10px;
            border-top: 1px solid var(--border-1);
        }

        .logout-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-1);
            background: transparent;
            color: var(--txt-3);
            font-size: 13px;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .logout-btn:hover {
            color: var(--rose);
            border-color: rgba(224,92,138,0.3);
            background: var(--rose-dim);
        }

        /* ── Main layout ────────────────────────────────── */
        .main {
            margin-left: var(--sidebar-w);
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            background: rgba(12,14,20,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-1);
        }

        #page-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--txt-2);
            letter-spacing: 0.01em;
        }

        .content-area {
            padding: 24px;
            flex: 1;
        }

        /* ── Dashboard grid ─────────────────────────────── */
        #dashboard-grid {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 14px;
        }
        #store-summary      { grid-row: span 2; }
        #region-summary,
        #temp-summary       { grid-column: 2; }
        #pendingStore-summary { grid-column: auto; }

        @media (max-width: 820px) {
            #dashboard-grid { grid-template-columns: 1fr; }
            #store-summary, #region-summary, #temp-summary { grid-column: 1; grid-row: auto; }
        }

        /* ── Card ───────────────────────────────────────── */
        .card {
            background: var(--surface-1);
            border: 1px solid var(--border-1);
            border-radius: var(--radius-lg);
            padding: 18px;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: var(--border-2); }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--txt-2);
        }

        /* ── Stat cards ─────────────────────────────────── */
        .stat-value {
            font-size: 30px;
            font-weight: 600;
            color: var(--txt-1);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--txt-3);
            margin-top: 4px;
        }

        /* ── Dot indicators ─────────────────────────────── */
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-violet { background: var(--violet); box-shadow: 0 0 0 2px var(--violet-dim); }
        .dot-amber  { background: var(--amber);  box-shadow: 0 0 0 2px var(--amber-dim); }
        .dot-rose   { background: var(--rose);   box-shadow: 0 0 0 2px var(--rose-dim); }
        .dot-teal   { background: var(--teal);   box-shadow: 0 0 0 2px var(--teal-dim); }

        /* ── Badges ─────────────────────────────────────── */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11.5px;
            font-weight: 500;
            line-height: 1.6;
        }
        .badge-violet { background: var(--violet-dim); color: var(--violet); }
        .badge-amber  { background: var(--amber-dim);  color: var(--amber); }
        .badge-rose   { background: var(--rose-dim);   color: var(--rose); }
        .badge-teal   { background: var(--teal-dim);   color: var(--teal); }
        .badge-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }

        /* Semantic aliases (backward-compat with JS files) */
        .badge-primary { background: var(--violet-dim); color: var(--violet); }
        .badge-warning { background: var(--amber-dim);  color: var(--amber); }
        .badge-danger  { background: var(--rose-dim);   color: var(--rose); }

        /* ── Refresh button ─────────────────────────────── */
        .refresh-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--txt-3);
            font-size: 13px;
            transition: color 0.15s, background 0.15s, transform 0.2s;
        }
        .refresh-btn:hover {
            color: var(--violet);
            background: var(--violet-dim);
            transform: rotate(90deg);
        }

        /* ── Buttons ────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 13.5px;
            font-weight: 500;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary {
            background: var(--violet);
            color: #fff;
        }
        .btn-primary:hover { background: #6b5ee0; }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-2);
            color: var(--txt-2);
        }
        .btn-ghost:hover { background: var(--border-1); color: var(--txt-1); }

        .btn-danger {
            background: var(--rose-dim);
            border: 1px solid rgba(224,92,138,0.2);
            color: var(--rose);
        }
        .btn-danger:hover { background: rgba(224,92,138,0.2); }

        /* ── Toolbar ────────────────────────────────────── */
        .toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        /* ── Store card (chart) ─────────────────────────── */
        .store-card canvas { max-height: 200px; margin: 12px 0; }
        .store-card { cursor: pointer; }
        .store-meta {
            font-size: 12.5px;
            color: var(--txt-2);
            margin-top: 6px;
        }
        .store-hint {
            font-size: 11.5px;
            color: var(--txt-3);
            margin-top: 4px;
        }

        /* ── Admin list items ───────────────────────────── */
        .admin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            border: 1px solid var(--border-1);
            border-left: 2px solid var(--violet);
            margin-bottom: 8px;
            transition: border-color 0.15s, background 0.15s;
        }
        .admin-item:hover {
            background: var(--surface-3);
            border-color: var(--border-2);
            border-left-color: var(--violet);
        }
        .admin-info { display: flex; flex-direction: column; gap: 3px; }
        .admin-title { font-size: 13.5px; font-weight: 500; }
        .admin-id    { font-family: var(--mono); font-size: 11.5px; color: var(--txt-2); margin-left: 6px; }
        .admin-meta  { font-size: 11.5px; color: var(--txt-3); }

        /* ── Clickable card  ────────────────────────────── */
        [data-clickable] { cursor: pointer; }

        /* ── Input fields (create-store page) ──────────── */
        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--txt-2);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .field input {
            width: 100%;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            background: var(--surface-2);
            border: 1px solid var(--border-2);
            color: var(--txt-1);
            font-family: var(--font);
            font-size: 13.5px;
            transition: border-color 0.15s;
        }
        .field input:focus {
            outline: none;
            border-color: var(--violet);
        }
        .field input[readonly] { color: var(--txt-2); }

        /* ── Error state ────────────────────────────────── */
        .error-card {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--txt-2);
            font-size: 13px;
        }
        .error-card i { color: var(--amber); }
    </style>
</head>

<body>
<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo" id="logo-text">ADMIN</div>
        <div class="brand-name">짝퉁배틀</div>
    </div>

    <nav class="nav-section">
        <div id="super-admin-menu" style="display:none">
            <div class="nav-item active" data-page="home">
                <i class="fa-solid fa-house"></i> 대시보드
            </div>
            <div class="nav-item" data-page="create-store">
                <i class="fa-solid fa-store"></i> 매장 생성
            </div>
            <div class="nav-item" data-page="store-list">
                <i class="fa-solid fa-clipboard-list"></i> 매장 목록
            </div>
            <div class="nav-item" data-page="temp">
                <i class="fa-solid fa-user-clock"></i> 임시 계정
            </div>
        </div>

        <div id="store-admin-menu" style="display:none">
            <div class="nav-item active" onclick="navigate('home', this)">
                <i class="fa-solid fa-house"></i> 홈
            </div>
            <div class="nav-item" onclick="navigate('my-store', this)">
                <i class="fa-solid fa-shop"></i> 내 매장
            </div>
        </div>
    </nav>

    <div class="sidebar-footer">
        <button id="logout-btn" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
            로그아웃
        </button>
    </div>
</aside>

<!-- MAIN -->
<div class="main">
    <div class="topbar">
        <span id="page-title">대시보드</span>
    </div>
    <div class="content-area" id="main-content"></div>
</div>
</body>
</html>
