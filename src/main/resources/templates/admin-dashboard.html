<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짝퉁배틀 관리자 대시보드</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/component.css">
    <link rel="stylesheet" href="/css/calender.css">
    <link rel="stylesheet" href="/css/vendor.css">
    <link rel="stylesheet" href="/css/storeActionModal.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/js/admin-dashboard.js"></script>
    <script type="module" src="/js/uis/common-uis.js"></script>
    <script type="module" src="/js/uis/store-uis.js"></script>
</head>

<body>
<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <div class="logo" id="logo-text">ADMIN</div>
        <div class="brand-name">짝퉁배틀</div>
    </div>

    <nav class="nav-section">
        <div id="super-admin-menu" style="display:none">

            <div class="nav-item active" data-page="home">
                <i class="fa-solid fa-house"></i> 대시보드
            </div>

            <!-- 🔥 매장 관리 -->
            <div class="nav-group">
                <div class="nav-item toggle">
                    <i class="fa-solid fa-store"></i> 매장 관리
                    <i class="fa-solid fa-chevron-down arrow"></i>
                </div>

                <div class="nav-sub" style="display:none">
                    <div class="nav-item sub" data-page="create-store">매장 생성</div>
                    <div class="nav-item sub" data-page="store-list">매장 목록</div>
                </div>
            </div>

            <!-- 🔥 기기 관리 -->
            <div class="nav-group">
                <div class="nav-item toggle">
                    <i class="fa-solid fa-microchip"></i> 기기 관리
                    <i class="fa-solid fa-chevron-down arrow"></i>
                </div>

                <div class="nav-sub" style="display:none">
                    <div class="nav-item sub" data-page="device-create">기기 등록</div>
                    <div class="nav-item sub" data-page="device-list">기기 목록</div>
                </div>
            </div>

            <!-- 기타 -->
            <div class="nav-item" data-page="temp">
                <i class="fa-solid fa-user-clock"></i> 임시 계정
            </div>

        </div>

        <div id="store-admin-menu" style="display:none">
            <div class="nav-item active" onclick="navigate('home', this)">
                <i class="fa-solid fa-house"></i> 홈
            </div>
            <div class="nav-item" onclick="navigate('my-store', this)">
                <i class="fa-solid fa-shop"></i> 내 매장
            </div>
        </div>
    </nav>

    <div class="sidebar-footer">
        <button id="logout-btn" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i>
            로그아웃
        </button>
    </div>
</aside>

<!-- MAIN -->
<div class="main">
    <div class="topbar">
        <span id="page-title">대시보드</span>
    </div>
    <div class="content-area" id="main-content"></div>
</div>
</body>
<script>
    document.querySelectorAll(".toggle").forEach(el => {
        el.addEventListener("click", () => {
            const sub = el.nextElementSibling;
            const isOpen = sub.style.display === "block";

            sub.style.display = isOpen ? "none" : "block";

            const arrow = el.querySelector(".arrow");
            arrow.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
        });
    });
</script>
</html>
