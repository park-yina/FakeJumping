<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>짝퉁배틀 관리자 로그인</title>

    <style>
        :root{
            --bg:#0f1117;
            --surface:#181c27;
            --surface2:#1e2436;
            --border:#2a3050;
            --primary:#4f80ff;
            --text:#e8eaf0;
            --text-dim:#8892a4;
        }

        body{
            margin:0;
            height:100vh;
            background:var(--bg);
            color:var(--text);
        }

        .wrapper{
            display:flex;
            height:100%;
        }

        /* 좌측 브랜딩 */
        .left{
            flex:1;
            background:linear-gradient(135deg,#1e2436,#0f1117);
            display:flex;
            flex-direction:column;
            justify-content:center;
            padding:60px;
        }

        .brand-title{
            font-size:36px;
            font-weight:700;
            margin-bottom:12px;
        }

        .brand-desc{
            color:var(--text-dim);
            font-size:14px;
        }

        /* 우측 로그인 */
        .right{
            width:420px;
            background:var(--surface);
            display:flex;
            align-items:center;
            justify-content:center;
            border-left:1px solid var(--border);
        }

        .login-box{
            width:100%;
            padding:40px;
        }

        .login-title{
            font-size:22px;
            font-weight:600;
            margin-bottom:20px;
        }

        .form-control{
            background:var(--surface2);
            border:1px solid var(--border);
            color:var(--text);
        }

        .form-control:focus{
            border-color:var(--primary);
            box-shadow:none;
        }

        .btn-primary{
            background:var(--primary);
            border:none;
        }

        .btn-primary:hover{
            opacity:0.9;
        }

        .text-dim{
            color:var(--text-dim);
            font-size:12px;
        }

        /* 모바일 */
        @media (max-width: 768px){
            .wrapper{
                flex-direction:column;
            }

            .left{
                display:none;
            }

            .right{
                width:100%;
                border-left:none;
            }
        }
    </style>
</head>

<body>

<div class="wrapper">

    <!-- 좌측 브랜딩 -->
    <div class="left">
        <div>
            <div class="brand-title">짝퉁배틀</div>
            <div class="brand-desc">
                매장 관리 · 관리자 시스템<br>
                실시간 운영 데이터를 한눈에 관리하세요.
            </div>
        </div>
    </div>

    <!-- 우측 로그인 -->
    <div class="right">

        <div class="login-box">

            <div class="login-title">관리자 로그인</div>

            <form id="loginForm">

                <div class="mb-3">
                    <label class="text-dim mb-1">아이디</label>
                    <input type="text" class="form-control" id="username" required>
                </div>

                <div class="mb-3">
                    <label class="text-dim mb-1">비밀번호</label>
                    <input type="password" class="form-control" id="password" required>

                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="showPassword">
                        <label class="form-check-label text-dim">
                            비밀번호 보기
                        </label>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">
                        로그인
                    </button>
                </div>

            </form>

            <div class="text-center mt-4 text-dim">
                © FakeJumping Admin
            </div>

        </div>

    </div>

</div>

<script>
    document.getElementById("showPassword").addEventListener("change", function () {
        const passwordInput = document.getElementById("password");
        passwordInput.type = this.checked ? "text" : "password";
    });

    document.getElementById("loginForm").addEventListener("submit", async function(e){
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try{
            const response = await fetch("/auth/sign-in",{
                method:"POST",
                credentials:"include",
                headers:{ "Content-Type":"application/json" },
                body:JSON.stringify({ username, password })
            });

            if (!response.ok) throw new Error();

            const data = await response.json();

            localStorage.setItem("role", data.role);
            localStorage.setItem("accessToken", data.accessToken);
            localStorage.setItem("storeName", data.storeSummary?.name || "");
            localStorage.setItem("storeId",data.storeSummary?.id||"");
            await Swal.fire({
                title:"로그인 성공",
                icon:"success"
            });

            if(data.mustChangePassword){
                location.href="/change-password";
            }else{
                location.href="/admin/dashboard";
            }

        }catch(e){
            Swal.fire({
                title:"로그인 실패",
                text:"아이디 또는 비밀번호 확인",
                icon:"error"
            });
        }
    });
</script>

</body>
</html>
