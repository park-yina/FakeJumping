<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />


    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>관리자 최초 로그인</title>

    <style>
        body{
            background-color:#f5f5f5;
            height:100vh;
        }

        .login-card{
            max-width:420px;
            border-radius:12px;
        }

        .logo{
            font-size:26px;
            font-weight:700;
            color:#343a40;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-6 col-lg-4">

            <div class="card login-card shadow-sm">

                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <div class="logo">짝퉁배틀</div>
                        <small class="text-muted">최초 로그인 - 정보 변경</small>
                    </div>

                    <form id="changeForm">

                        <!-- username -->
                        <div class="mb-3">
                            <label class="form-label">아이디</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    placeholder="새 아이디 입력"
                                    required>
                        </div>

                        <!-- password -->
                        <div class="mb-3">
                            <label class="form-label">비밀번호</label>
                            <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="새 비밀번호 입력"
                                    required>
                        </div>

                        <!-- password confirm -->
                        <div class="mb-3">
                            <label class="form-label">비밀번호 확인</label>
                            <input
                                    type="password"
                                    class="form-control"
                                    id="confirmPassword"
                                    placeholder="비밀번호 다시 입력"
                                    required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-dark">
                                변경하기
                            </button>
                        </div>

                    </form>

                </div>

            </div>

            <div class="text-center mt-3 text-muted small">
                © FakeJumping Admin
            </div>

        </div>

    </div>

</div>

<script>

    document.getElementById("changeForm").addEventListener("submit", async function(e){

        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        // ✅ 비밀번호 확인
        if(password !== confirmPassword){
            Swal.fire({
                title:"오류",
                text:"비밀번호가 일치하지 않습니다.",
                icon:"error"
            });
            return;
        }

        try{

            const response = await fetch("/auth/change-password", {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer " + localStorage.getItem("accessToken")
                },
                body:JSON.stringify({
                    newUsername:username,
                    newPassword:password
                })
            });

            if(!response.ok){
                throw new Error();
            }

            await Swal.fire({
                title:"변경 완료",
                text:"정보가 성공적으로 변경되었습니다.",
                icon:"success",
                confirmButtonText:"확인"
            });

            // ✅ 변경 후 대시보드 이동
            window.location.href="/admin/dashboard";

        }catch(e){

            Swal.fire({
                title:"오류",
                text:"정보 변경 중 문제가 발생했습니다.",
                icon:"error"
            });

        }

    });

</script>

</body>
</html>
