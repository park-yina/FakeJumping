<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>최초 로그인 - 정보 변경</title>

    <style>
        :root{
            --bg:#0f1117;
            --surface:#181c27;
            --surface2:#1e2436;
            --border:#2a3050;
            --primary:#4f80ff;
            --text:#e8eaf0;
            --text-dim:#8892a4;
        }

        body{
            margin:0;
            height:100vh;
            background:var(--bg);
            color:var(--text);
        }

        .wrapper{
            display:flex;
            height:100%;
        }

        .left{
            flex:1;
            background:linear-gradient(135deg,#1e2436,#0f1117);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:60px;
        }

        .brand-title{
            font-size:36px;
            font-weight:700;
            margin-bottom:10px;
        }

        .brand-desc{
            color:var(--text-dim);
            font-size:14px;
        }

        .right{
            width:420px;
            background:var(--surface);
            display:flex;
            align-items:center;
            justify-content:center;
            border-left:1px solid var(--border);
        }

        .box{
            width:100%;
            padding:40px;
        }

        .title{
            font-size:22px;
            font-weight:600;
            margin-bottom:20px;
        }

        .form-control{
            background:var(--surface2);
            border:1px solid var(--border);
            color:var(--text);
        }

        .form-control:focus{
            border-color:var(--primary);
            box-shadow:none;
        }

        .btn-primary{
            background:var(--primary);
            border:none;
        }

        .text-dim{
            color:var(--text-dim);
            font-size:12px;
        }

        @media (max-width:768px){
            .wrapper{
                flex-direction:column;
            }
            .left{
                display:none;
            }
            .right{
                width:100%;
                border-left:none;
            }
        }
    </style>
</head>

<body>

<div class="wrapper">

    <!-- 좌측 -->
    <div class="left">
        <div>
            <div class="brand-title">짝퉁배틀</div>
            <div class="brand-desc">
                <span id="storeName"></span> 관리자 계정입니다.<br>
                보안을 위해 비밀번호를 변경해주세요.
            </div>
        </div>
    </div>

    <!-- 우측 -->
    <div class="right">

        <div class="box">

            <div class="title">정보 변경</div>

            <form id="changeForm">

                <div class="mb-3">
                    <label class="text-dim mb-1">새 비밀번호</label>
                    <input type="password" class="form-control" id="password" required>
                </div>

                <div class="mb-3">
                    <label class="text-dim mb-1">비밀번호 확인</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">
                        변경하기
                    </button>
                </div>

            </form>

            <div class="text-center mt-4 text-dim">
                © FakeJumping Admin
            </div>

        </div>

    </div>

</div>

<script>
        async function loadStoreName() {
        try {
        const res = await fetch("/auth/me", {
        headers: {
        Authorization: "Bearer " + localStorage.getItem("accessToken")
    }
    });

        if (!res.ok) throw new Error();

        const data = await res.json();

        document.getElementById("storeName").textContent =
        data.storeName ?? "관리자";

    } catch (e) {
        document.getElementById("storeName").textContent = "관리자";
    }
    }

        loadStoreName();
    document.getElementById("changeForm").addEventListener("submit", async function(e){
        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if(password !== confirmPassword){
            Swal.fire({
                title:"오류",
                text:"비밀번호가 일치하지 않습니다.",
                icon:"error"
            });
            return;
        }

        try{
            const response = await fetch("/auth/change-password", {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer " + localStorage.getItem("accessToken")
                },
                body:JSON.stringify({
                    newPassword:password
                })
            });

            if(!response.ok) throw new Error();

            await Swal.fire({
                title:"변경 완료",
                icon:"success"
            });

            location.href="/admin/dashboard";

        }catch(e){
            Swal.fire({
                title:"오류",
                text:"정보 변경 실패",
                icon:"error"
            });
        }
    });
</script>

</body>
</html>
