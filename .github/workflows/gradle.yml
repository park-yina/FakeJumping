name: Java CI/CD with Gradle

on:
  push:
    branches: [ "dev", "stage", "master" ]
  pull_request:
    branches: [ "master", "stage" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
        env:
          JASYPT_PASSWORD: ${{ secrets.JASYPT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Login to DockerHub
        if: github.event_name == 'push'
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker Image
        if: github.event_name == 'push'
        run: docker build -t parkyina/fakejumping:latest .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: docker push parkyina/fakejumping:latest

      - name: Deploy to EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop fakejumping-app || true
            docker rm fakejumping-app || true

            docker pull parkyina/fakejumping:latest

            docker run -d \
              --name fakejumping-app \
              -p 8080:8080 \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JASYPT_PASSWORD=${{ secrets.JASYPT_PASSWORD }} \
              -e SPRING_DATASOURCE_USERNAME=yina \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://db-test.ca90segwm4q1.us-east-1.rds.amazonaws.com:3306/fakebattle?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true \
              parkyina/fakejumping:latest
