name: Java CI/CD with Gradle

on:
  push:
    branches: [ "stage", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ✅ SHA 짧게 만들기
      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      # ✅ JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ✅ Gradle 캐시
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ 빌드
      - name: Build with Gradle
        run: ./gradlew build
        env:
          JASYPT_PASSWORD: ${{ secrets.JASYPT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      # ✅ Docker 로그인
      - name: Login to DockerHub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # ✅ Docker build + cache + push
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            parkyina/fakejumping:latest
            parkyina/fakejumping:${{ env.SHORT_SHA }}
          cache-from: type=registry,ref=parkyina/fakejumping:latest
          cache-to: type=inline

      # 🚀 배포 + 롤백 + 로그
      - name: Deploy to EC2 (with rollback & logs)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Deploy start"

            NEW_IMAGE=parkyina/fakejumping:${{ env.SHORT_SHA }}
            OLD_CONTAINER=$(docker ps -q --filter "name=fakejumping-app")

            echo "📦 Pull new image"
            docker pull $NEW_IMAGE

            echo "🆕 Run new container (8081)"
            docker run -d \
              --name fakejumping-new \
              -p 8081:8080 \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JASYPT_PASSWORD=${{ secrets.JASYPT_PASSWORD }} \
              -e SPRING_DATASOURCE_USERNAME=yina \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e "SPRING_DATASOURCE_URL=jdbc:mysql://db-test.ca90segwm4q1.us-east-1.rds.amazonaws.com:3306/fakebattle?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true" \
              $NEW_IMAGE

            # 🔥 초기 로그 출력
            echo "📋 container logs (initial)"
            sleep 3
            docker logs fakejumping-new || true

            echo "⏳ Waiting for health check..."

            for i in {1..10}
            do
              if curl -f http://localhost:8081/actuator/health; then
                echo "✅ Health check success"
                break
              fi

              echo "⏳ retry... ($i)"

              # 🔥 중간 로그 확인
              docker logs fakejumping-new --tail 20 || true

              sleep 5
            done

            # ❗ 최종 실패 체크 → 롤백
            if ! curl -f http://localhost:8081/actuator/health; then
              echo "❌ Health check failed → rollback"

              echo "📋 final container logs"
              docker logs fakejumping-new || true

              docker stop fakejumping-new || true
              docker rm fakejumping-new || true
              exit 1
            fi

            echo "🧹 Remove old container"
            if [ ! -z "$OLD_CONTAINER" ]; then
              docker stop $OLD_CONTAINER || true
              docker rm $OLD_CONTAINER || true
            fi

            echo "🔄 Switch to new container (8080)"
            docker stop fakejumping-new
            docker rm fakejumping-new

            docker run -d \
              --name fakejumping-app \
              -p 8080:8080 \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JASYPT_PASSWORD=${{ secrets.JASYPT_PASSWORD }} \
              -e SPRING_DATASOURCE_USERNAME=yina \
              -e WEB_HOOK=${{ secrets.WEB_HOOK }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e "SPRING_DATASOURCE_URL=jdbc:mysql://db-test.ca90segwm4q1.us-east-1.rds.amazonaws.com:3306/fakebattle?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true" \
              $NEW_IMAGE

            echo "🎉 Deploy success"